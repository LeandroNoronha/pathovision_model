# PathoVision Improved — Enhancements Over Paper Baseline
# Inherits most settings from base.yaml, overrides specific improvements

experiment:
  name: "pathovision_improved"
  seed: 42
  output_dir: "outputs"

data:
  dataset_dir: "datasets/data"
  input_size: [500, 500]
  batch_size: 16
  accumulation_steps: 2
  num_workers: 4
  pin_memory: true
  balanced_sampling: true  # WeightedRandomSampler for class balance
  classes:
    - "Acne"
    - "Candidiasis"
    - "Eczema"
    - "NailFungus"
    - "Normal"
    - "Psoriasis"
    - "Tinea"

augmentation:
  # Paper augmentation (kept)
  rotation_limit: 20
  shift_limit: 0.2
  horizontal_flip: true
  zoom_limit: 0.2
  shear_limit: 20
  # Enhanced augmentation
  color_jitter:
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
    hue: 0.05
  random_erasing:
    probability: 0.1
    scale: [0.02, 0.15]
  clahe:
    clip_limit: 2.0
    probability: 0.3
  elastic:
    alpha: 50
    sigma: 5
    probability: 0.1

model:
  backbone: "efficientnetv2_s"
  pretrained: true
  freeze_strategy: "last_n"
  freeze_except_last_n: 20
  head:
    type: "pathovision"
    hidden_dims: [512, 256]
    dropout_rates: [0.4, 0.3]
    activation: "relu"
  num_classes: 7

training:
  epochs: 80
  optimizer:
    name: "adamw"
    lr: 0.0001
    weight_decay: 0.01
  loss:
    name: "focal"
    class_weights: "inverse_frequency"
    label_smoothing: 0.1
    focal_gamma: 2.0
  mixed_precision: true
  gradient_clip: 1.0
  scheduler:
    name: "cosine_warmup"
    warmup_epochs: 5
    min_lr: 0.0000001

callbacks:
  reduce_lr:
    enabled: false  # Using cosine scheduler instead
  checkpoint:
    enabled: true
    monitor: "val_accuracy"
    mode: "max"
    save_top_k: 3
  early_stopping:
    enabled: true
    monitor: "val_loss"
    patience: 20
    min_delta: 0.001

evaluation:
  tta: true
  tta_transforms: 5
  save_predictions: true
  generate_plots: true
  export_latex: true
