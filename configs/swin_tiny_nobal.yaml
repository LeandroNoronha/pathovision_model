# M3b: Swin-Tiny SEM balanceamento
# Comparação: M3 (balanced) vs M3b (não-balanced)

experiment:
  name: "swin_tiny_nobal"
  seed: 42
  output_dir: "outputs"

data:
  dataset_dir: "datasets/data"
  input_size: [224, 224]
  batch_size: 32
  accumulation_steps: 1
  num_workers: 4
  pin_memory: true
  balanced_sampling: false
  classes:
    - "Acne"
    - "Candidiasis"
    - "Eczema"
    - "NailFungus"
    - "Normal"
    - "Psoriasis"
    - "Tinea"

augmentation:
  rotation_limit: 20
  shift_limit: 0.2
  horizontal_flip: true
  zoom_limit: 0.2
  shear_limit: 20

model:
  backbone: "swin_tiny"
  pretrained: true
  freeze_strategy: "last_n"
  freeze_except_last_n: 30
  head:
    type: "pathovision"
    hidden_dims: [512, 256]
    dropout_rates: [0.4, 0.3]
    activation: "relu"
  num_classes: 7

training:
  epochs: 50
  optimizer:
    name: "adam"
    lr: 0.0001
    weight_decay: 0.0
  loss:
    name: "cross_entropy"
    class_weights: null
    label_smoothing: 0.0
    focal_gamma: null
  mixed_precision: true
  gradient_clip: null

callbacks:
  reduce_lr:
    enabled: true
    monitor: "val_loss"
    factor: 0.2
    patience: 5
    min_lr: 0.0000001
  checkpoint:
    enabled: true
    monitor: "val_accuracy"
    mode: "max"
    save_top_k: 1
  early_stopping:
    enabled: false

evaluation:
  tta: false
  save_predictions: true
  generate_plots: true
  export_latex: true
